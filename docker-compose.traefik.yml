# Optional Traefik reverse proxy in front of the portal (TLS termination, one proxy hop).
#
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
#
# .env (see .env.example):
#   PORTAL_HOST=ai.example.com                # host name of the portal; PUBLIC_URL must be https://<PORTAL_HOST> (or http:// without TLS)
#   COOKIE_SECURE=true                        # false when you only use plain HTTP
#   TRAEFIK_ACME_EMAIL=admin@example.com      # optional: Let's Encrypt (HTTP challenge, needs port 80 reachable from the internet)
#   TRAEFIK_CERTRESOLVER=le                   # set together with TRAEFIK_ACME_EMAIL; empty = Traefik's built-in default certificate
#
# Streaming answers are not buffered by Traefik and it sets no request body limit; the portal itself limits uploads (UPLOAD_MAX_MB).
services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=ai-portal-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # no read timeout for long streaming answers (the default is 0 = unlimited, kept explicit)
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=600s
      - --certificatesresolvers.le.acme.email=${TRAEFIK_ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
    networks: [default, proxy]

  app:
    # reachable only through Traefik: no published port
    ports: !reset []
    networks: [default, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=ai-portal-proxy
      - traefik.http.services.portal.loadbalancer.server.port=8080
      # HTTPS
      - traefik.http.routers.portal.rule=Host(`${PORTAL_HOST:-ai.localhost}`)
      - traefik.http.routers.portal.entrypoints=websecure
      - traefik.http.routers.portal.tls=true
      - traefik.http.routers.portal.tls.certresolver=${TRAEFIK_CERTRESOLVER:-}
      # HTTP -> HTTPS redirect
      - traefik.http.routers.portal-http.rule=Host(`${PORTAL_HOST:-ai.localhost}`)
      - traefik.http.routers.portal-http.entrypoints=web
      - traefik.http.routers.portal-http.middlewares=portal-https
      - traefik.http.middlewares.portal-https.redirectscheme.scheme=https
      - traefik.http.middlewares.portal-https.redirectscheme.permanent=true

networks:
  proxy:
    name: ai-portal-proxy

volumes:
  traefik-acme:
