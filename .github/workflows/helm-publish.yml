name: Helm Chart

# Packages helm/ai-portal and pushes it to oci://ghcr.io/<owner>/charts.
# Called by release.yml; can also be run by hand to (re-)publish the chart of a tag.
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to package the chart from"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or branch) to package the chart from, e.g. 1.2.3"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Package & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Lint chart
        run: |
          helm lint helm/ai-portal --set secret.databaseUrl=postgres://u:p@db:5432/aiportal
          helm lint helm/ai-portal --set cnpg.enabled=true --set ingress.enabled=true --set networkPolicy.enabled=true
          helm lint helm/ai-portal --set secret.databaseUrl=postgres://u:p@db:5432/aiportal --set traefik.enabled=true --set traefik.tls.certResolver=le
          helm template ai-portal helm/ai-portal --set secret.databaseUrl=postgres://u:p@db:5432/aiportal > /dev/null

      - name: Package chart
        run: helm package helm/ai-portal --destination dist

      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push dist/ai-portal-*.tgz "oci://ghcr.io/${owner}/charts"

      # GitHub has no API to change a package's visibility: make the chart package public once
      # (profile -> Packages -> charts/ai-portal -> Package settings -> Change visibility). This step fails until that is done.
      - name: Verify the chart is public
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version=$(helm show chart dist/ai-portal-*.tgz | awk '/^version:/ {print $2}')
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${owner}/charts/ai-portal:pull" | jq -r .token || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}"             -H 'Accept: application/vnd.oci.image.manifest.v1+json'             "https://ghcr.io/v2/${owner}/charts/ai-portal/manifests/${version}")
          if [ "$code" != "200" ]; then
            echo "::error::oci://ghcr.io/${owner}/charts/ai-portal:${version} is not publicly pullable (HTTP ${code}). Make the package public: https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/charts%2Fai-portal/settings"
            exit 1
          fi
          echo "chart ${version} is public"
