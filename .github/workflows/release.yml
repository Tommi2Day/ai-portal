name: Release

# Publishes the image tommi2day/ai-portal on Docker Hub:
#   git tag 1.2.3 && git push origin 1.2.3     → :1.2.3 :1.2 :1 :latest :sha-<short>
#   Actions → Release → Run workflow (tag)      → bumps the versions on main first, then the same
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version / Docker image tag (e.g. 1.2.3)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: tommi2day/ai-portal

jobs:
  bump-version:
    name: Bump version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Update package.json files and Kubernetes image tag
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          (cd server && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          (cd web && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          sed -i -E "s/^(\s*newTag: ).*/\1\"$VERSION\"/" deploy/k8s/kustomization.yaml

      - name: Commit and push
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/package.json server/package-lock.json web/package.json web/package-lock.json deploy/k8s/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore: bump version to $VERSION"
          git push

  test:
    name: Unit tests & build
    runs-on: ubuntu-latest
    needs: [bump-version]
    if: always() && !failure() && !cancelled()

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Server
        working-directory: server
        run: npm ci && npm test && npm run build

      - name: Web
        working-directory: web
        run: npm ci && npm run i18n:check && npm test && npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [bump-version]
    if: always() && !failure() && !cancelled()
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Start test stack
        run: docker compose -f docker-compose.test.yml up -d --wait --quiet-pull

      - name: Integration tests
        working-directory: server
        run: npm ci && npm run test:integration

      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color --tail=200

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  docker:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [test, integration]
    # bump-version is skipped on tag push; without an explicit status check the
    # implicit success() would skip this job because of that skipped ancestor.
    if: always() && !failure() && !cancelled()

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # git tag or release → :1.2.3  :1.2  :1  :latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            # manual dispatch → entered tag
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # always: :sha-<short>
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
