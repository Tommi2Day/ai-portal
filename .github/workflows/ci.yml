name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: Unit tests & build (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [server, web]
    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22        # same major as the runtime image (node:22-alpine)
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high

      - name: Translations complete
        if: matrix.package == 'web'
        run: npm run i18n:check

      - name: Test (typecheck + vitest with coverage)
        run: npm test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Tommi2Day/ai-portal
          files: ${{ matrix.package }}/coverage/lcov.info
          flags: ${{ matrix.package }}

      - name: Build
        run: npm run build

  integration:
    name: Integration tests (PostgreSQL, pg-mcp-server, Oracle, oracle-mcp-server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Start test stack
        working-directory: .
        run: docker compose -f docker-compose.test.yml up -d --wait --quiet-pull

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration
        env:
          IT_SHOW_LOG: "1"

      - name: Container logs
        if: failure()
        working-directory: .
        run: docker compose -f docker-compose.test.yml logs --no-color --tail=200

      - name: Stop test stack
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.test.yml down -v

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [unit]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ai-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image starts and fails fast without configuration
        run: |
          # config validation must reject a missing SESSION_SECRET / ENCRYPTION_KEY with a clear message
          if docker run --rm ai-portal:ci > out.log 2>&1; then echo "container started without secrets"; exit 1; fi
          grep -q SESSION_SECRET out.log
