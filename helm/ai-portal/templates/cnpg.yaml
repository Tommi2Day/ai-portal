{{- if .Values.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "ai-portal.dbName" . }}
  labels:
    {{- include "ai-portal.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cnpg.instances }}
  storage:
    size: {{ .Values.cnpg.storageSize }}
    {{- with .Values.cnpg.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.cnpg.database }}
      owner: {{ .Values.cnpg.owner }}
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
{{- end }}
