{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-portal.fullname" . }}
  labels:
    {{- include "ai-portal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-portal.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} }
      ports: [{ port: 8080 }]
{{- end }}
