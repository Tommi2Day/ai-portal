{{- if not .Values.existingSecret -}}
{{- $name := include "ai-portal.fullname" . -}}
{{- $old := dict -}}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) }}{{ $old = .data | default dict }}{{ end -}}
{{- $session := .Values.secret.sessionSecret | default (index $old "SESSION_SECRET" | default "" | b64dec) | default (randAlphaNum 48) -}}
{{- $enc := .Values.secret.encryptionKey | default (index $old "ENCRYPTION_KEY" | default "" | b64dec) | default (randAlphaNum 32 | b64enc) -}}
{{- $admin := .Values.secret.bootstrapAdminPassword | default (index $old "BOOTSTRAP_ADMIN_PASSWORD" | default "" | b64dec) | default (randAlphaNum 20) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ai-portal.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ $session | quote }}
  ENCRYPTION_KEY: {{ $enc | quote }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ $admin | quote }}
  {{- if and (not .Values.cnpg.enabled) .Values.secret.databaseUrl }}
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  {{- end }}
  {{- range $k, $v := .Values.secret.extra }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
