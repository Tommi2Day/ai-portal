apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-portal.fullname" . }}
  labels:
    {{- include "ai-portal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ai-portal.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
