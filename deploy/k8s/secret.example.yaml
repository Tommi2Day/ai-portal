apiVersion: v1
kind: Secret
metadata:
  name: ai-portal
type: Opaque
stringData:
  # Die DB braucht die Erweiterung pgvector (CREATE EXTENSION vector; läuft als Migration, erfordert ggf. Owner-/Superuser-Rechte)
  DATABASE_URL: postgres://aiportal:CHANGE_ME@ai-portal-db-rw:5432/aiportal
  SESSION_SECRET: CHANGE_ME_min_32_chars_random_value_here
  ENCRYPTION_KEY: CHANGE_ME_base64_32_bytes
  BOOTSTRAP_ADMIN_PASSWORD: CHANGE_ME
