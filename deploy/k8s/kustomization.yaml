apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-portal
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml
  # Optional: SMB-Freigabe für die Wissensdatenbank
  # - share-smb.yaml
  # Optional: Postgres via CloudNativePG-Operator
  # - postgres-cnpg.yaml
images:
  - name: ai-portal
    newName: registry.firma.local/ai-portal
    newTag: "1.0.0"
