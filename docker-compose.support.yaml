# Supporting services for the portal: Traefik reverse proxy (TLS, HTTP -> HTTPS) and Keycloak as OIDC provider,
# both routed by Traefik through labels. The portal's own labels and OIDC settings are in docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.support.yaml up -d
#
# Required in .env (git-ignored, never commit it; see .env.example):
#   PORTAL_HOST / KEYCLOAK_HOST     host names, e.g. ai.example.com / auth.example.com (both must resolve to this machine)
#   PUBLIC_URL=https://<PORTAL_HOST>, COOKIE_SECURE=true, OIDC_ENABLED=true
#   KEYCLOAK_ADMIN_PASSWORD         password of the Keycloak admin user "admin"
#   OIDC_CLIENT_SECRET              random secret of the Keycloak client "ai-portal" (e.g. openssl rand -hex 32)
# Optional:
#   TRAEFIK_ACME_EMAIL + TRAEFIK_CERTRESOLVER=le   Let's Encrypt (HTTP challenge, port 80 reachable from the internet)
#   TRAEFIK_CERTS_DIR=./certs                      tls.crt/tls.key for your own certificate (deploy/traefik/tls.yml);
#                                                  OIDC_CA_FILE=/certs/ca.crt if it is signed by an internal CA the portal must trust
#   KEYCLOAK_LOG_LEVEL, TRAEFIK_LOG_LEVEL, TRAEFIK_HTTP_PORT, TRAEFIK_HTTPS_PORT
#
# Keycloak: the realm "ai-portal" is imported once from deploy/keycloak/ai-portal-realm.json (the secrets come from .env,
# the file holds only placeholders). It has the groups ai-portal-admins (portal admins) and ai-portal-users and the client
# "ai-portal". Create users in https://<KEYCLOAK_HOST>/admin and add them to a group. For production use a real database
# for Keycloak instead of the built-in file database (KC_DB_* variables, see the Keycloak docs).
#
# Streaming answers are not buffered by Traefik and it sets no request body limit; the portal limits uploads (UPLOAD_MAX_MB).
services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=ai-portal-proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # no read timeout for long streaming answers (the default is 0 = unlimited, kept explicit)
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=600s
      - --certificatesresolvers.le.acme.email=${TRAEFIK_ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
      - ./deploy/traefik:/etc/traefik/dynamic:ro
      - ${TRAEFIK_CERTS_DIR:-./certs}:/certs:ro
    networks:
      default: {}
      proxy:
        # containers (the portal's OIDC discovery) reach the public host names through Traefik
        aliases:
          - ${PORTAL_HOST:-ai.localhost}
          - ${KEYCLOAK_HOST:-auth.localhost}

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: https://${KEYCLOAK_HOST:-auth.localhost}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: ${KEYCLOAK_LOG_LEVEL:-INFO}
      # placeholders ${...} in the realm file
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      PORTAL_PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
    volumes:
      - ./deploy/keycloak/ai-portal-realm.json:/opt/keycloak/data/import/ai-portal-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      # no curl in the image: plain HTTP request to the management port
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=ai-portal-proxy
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
      - traefik.http.routers.keycloak.rule=Host(`${KEYCLOAK_HOST:-auth.localhost}`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.routers.keycloak.tls.certresolver=${TRAEFIK_CERTRESOLVER:-}
      - traefik.http.routers.keycloak-http.rule=Host(`${KEYCLOAK_HOST:-auth.localhost}`)
      - traefik.http.routers.keycloak-http.entrypoints=web
      - traefik.http.routers.keycloak-http.middlewares=keycloak-https
      - traefik.http.middlewares.keycloak-https.redirectscheme.scheme=https
      - traefik.http.middlewares.keycloak-https.redirectscheme.permanent=true

  app:
    # reachable only through Traefik: no published port
    ports: !reset []
    networks: [default, proxy]
    environment:
      # trust for an internal CA signing the Traefik certificate (OIDC discovery runs over the public URL)
      NODE_EXTRA_CA_CERTS: ${OIDC_CA_FILE:-}
    volumes:
      - ${TRAEFIK_CERTS_DIR:-./certs}:/certs:ro
    depends_on:
      keycloak: { condition: service_healthy }

networks:
  proxy:
    name: ai-portal-proxy

volumes:
  traefik-acme:
  keycloak-data:
